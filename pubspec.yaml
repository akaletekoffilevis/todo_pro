name: todo_pro
description: "Todo list avancée, production-ready, architecture Bloc, backend Firebase, i18n FR/EN, tests complets."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Architecture Bloc
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # Performance
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^14.8.1

  # Persistance
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Design premium
  google_fonts: ^6.2.1

  # Utilitaires
  equatable: ^2.0.7
  intl: any
  path_provider: ^2.1.5
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Tests
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  generate: true
